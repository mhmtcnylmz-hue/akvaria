let FISH=[],ALL=false;
function newF(){return {x:.12+Math.random()*.76,y:.15+Math.random()*.62,v:0,pitch:0,dir:Math.random()<.5?1:-1,tx:.5,ty:.4,mode:"glide",modeT:Math.random(),beats:0,w:Math.random()*6,f:Math.random()*6,b:0,amp:.15,fold:.5,bend:0,turnP:1,turnFrom:1,look:[0,0],lookT:0,sac:[0,0],lookAt:null,lookUntil:0,urg:0,turnCool:0}}

function pick(){const ahead=Math.random()<.75,d=F.dir*(ahead?1:-1);let tx=F.x+d*(.3+Math.random()*.35);if(tx<.18||tx>.82)tx=F.x-d*(.3+Math.random()*.3);F.tx=Math.max(.18,Math.min(.82,tx));F.ty=.15+Math.random()*.62;F.pickT=performance.now()}
function lenPx(f){return ALL?Math.min(W,H)*.42*f.mp.size:Math.min(W,H)*.8*(opt.big?.78:.55)}
const sel=document.getElementById("sel");

 for(const k of list){const X=SPEC[k];if(X.R.govde.vao){if(--left===0)ready()}else loadSpec(X,()=>{if(--left===0)ready()})}}
cv.addEventListener("pointerdown",e=>{if(!FISH.length)return;const now=performance.now();let best=null,bd=1e9;
 for(const f of FISH){f.F.lookAt=[e.clientX,e.clientY];f.F.lookUntil=now+1600;const d=Math.hypot(f.F.x*W-e.clientX,f.F.y*H-e.clientY);if(d<bd){bd=d;best=f}}
 const G=best.F;G.flare=1;G.turnCool=0;G.tap=1;G.pickT=now;G.tx=e.clientX/W;G.ty=Math.min(.75,Math.max(.15,e.clientY/H));G.urg=1;if(G.mode!=="turn"){G.mode="burst";G.beats=Math.max(2,Math.min(5,1+Math.hypot((G.tx-G.x)*W,(G.ty-G.y)*H)/120|0))}});
document.getElementById("p").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;opt[k]=!opt[k];b.classList.toggle("on",opt[k])});
const MODEN={glide:"süzülüyor",burst:"kuyruk vuruşu",hover:"durup kürek çekiyor",turn:"dönüyor"};
function step(fish,now,dt){F=fish.F;SP=fish.sp;MP=fish.mp;const BLpx=lenPx(fish);
 const tdx=(F.tx-F.x)*W,tdy=(F.ty-F.y)*H,dist=Math.hypot(tdx,tdy),near0=BLpx*.25;
 const behind=Math.sign(tdx)!==F.dir,fresh=now-(F.pickT||0)<1500;
 if((F.mode==="burst"||F.mode==="glide")&&(dist<(F.tap?Math.max(30,near0):Math.max(60,near0*2))||(!F.tap&&!fresh&&behind&&Math.abs(tdx)<170))){F.mode="hover";F.modeT=(1.4+Math.random()*1.8)*MP.hover;F.urg=0}
 else if(F.mode!=="turn"&&F.mode!=="hover"&&behind&&Math.abs(tdx)>=(fresh?70:170)&&(fresh||now>F.turnCool)){F.mode="turn";F.turnP=0;F.turnFrom=F.dir;F.dir=-F.dir}
 F.modeT-=dt;const fq=MP.freq;
 if(F.mode==="turn"){F.turnP=Math.min(1,F.turnP+dt/(.75/Math.sqrt(fq)));F.w+=dt*4*fq;F.bend=Math.sin(F.turnP*Math.PI)*.9;F.v*=1-dt*1.2;if(F.turnP>=1){F.mode="burst";F.beats=2;F.bend=0;F.turnCool=now+1800}}
 else if(F.mode==="burst"){const pw=F.w;F.w+=dt*(6.2+1.8*F.urg)*fq;if(Math.floor(pw/6.283)!==Math.floor(F.w/6.283)){const near=Math.min(1,dist/(BLpx*1.5));F.v=Math.min((1.05+.55*F.urg)*MP.sp*(.5+.5*near),F.v+(.42+.22*F.urg)*MP.sp/Math.max(1,fq*.75)*(.45+.55*near));F.beats--}
  if(F.beats<=0){F.mode="glide";F.modeT=(.9+Math.random()*1.4)*MP.glide;F.urg=Math.max(0,F.urg-.5)}}
 else if(F.mode==="glide"){F.w+=dt*1.6*fq;if(F.modeT<=0||F.v<.25*MP.sp){F.mode="burst";F.beats=Math.max(1,Math.min(5,1+dist/(BLpx*.9)|0));F.modeT=1.5+Math.random()*2.5}}
 else if(F.mode==="hover"){F.w+=dt*1.4*fq;if(F.modeT<=0){F.tap=0;pick();F.mode="glide";F.modeT=.3}}
 F.v*=1-dt*(F.mode==="hover"?1.8:.55/Math.max(.6,MP.glide));
 const pT=F.mode==="hover"||F.mode==="turn"?Math.max(-.25,Math.min(.25,Math.atan2(tdy,Math.max(60,Math.abs(tdx)))))*(dist>30?1:0):Math.max(-.8,Math.min(.8,Math.atan2(tdy,Math.max(20,Math.abs(tdx)))));
 F.pitch+=(pT-F.pitch)*Math.min(1,dt*(F.mode==="burst"?3:1.6));
 if(F.mode==="hover"&&dist>20)F.v=Math.max(F.v,Math.min(.18*Math.min(1.4,MP.pectA),dist/BLpx*.6));
 F.x+=F.v*BLpx*Math.cos(F.pitch)*F.dir*dt/W;F.y+=F.v*BLpx*Math.sin(F.pitch)*dt/H;
 {const mg=Math.min(.45,BLpx*.5/W+.02);if((F.dir<0&&F.x<mg+.08)||(F.dir>0&&F.x>1-mg-.08)){if(!F.tap&&F.mode!=="turn"&&F.mode!=="hover"){F.v*=1-dt*2;if(Math.sign(F.tx-F.x)===F.dir)pick()}}F.x=Math.max(mg,Math.min(1-mg,F.x));if(F.tap)F.tx=Math.max(mg,Math.min(1-mg,F.tx))}{const yb=Math.max(.12,Math.min(.8,F.y));if(yb!==F.y){F.y=yb;F.pitch*=.9}}
 F.spd=Math.min(1,F.v/(1.2*MP.sp));
 const ampT=(F.mode==="burst"?.5+.08*F.urg:F.mode==="turn"?.35:F.mode==="hover"?.12:.08)*MP.amp;F.amp+=(ampT-F.amp)*Math.min(1,dt*3.5);
 const foldT=F.urg>.6||F.mode==="hover"||F.mode==="turn"?0:F.spd>.45?.75:.3;F.fold+=(foldT-F.fold)*Math.min(1,dt*(foldT<F.fold?5:1.8));
 const tspT=F.mode==="burst"||F.mode==="turn"?1:0;F.tsp=(F.tsp||0)+(tspT-(F.tsp||0))*Math.min(1,dt*3);F.flare=Math.max(0,(F.flare||0)-dt*1.6);
 F.f+=dt*(F.mode==="hover"?4.2:2.6)*MP.pect;F.b+=dt*(F.mode==="hover"?3:2.2);
 if(now>F.lookT){F.lookT=now+500+Math.random()*1600;F.look=[Math.random()*2-1,Math.random()*1.4-.7]}}
function draw(fish,now,dt){F=fish.F;SP=fish.sp;MP=fish.mp;
 const sc=lenPx(fish)/(SP.head-SP.tip),fx=F.x*W,fy=F.y*H+Math.sin(now/1100+F.b)*3;
 let lk=F.look;if(F.lookUntil>now&&F.lookAt){const lx=(F.lookAt[0]-fx)*F.dir,ly=F.lookAt[1]-fy,mm=Math.hypot(lx,ly)||1;lk=[lx/mm,ly/mm]}
 F.sac[0]+=(lk[0]-F.sac[0])*Math.min(1,dt*18);F.sac[1]+=(lk[1]-F.sac[1])*Math.min(1,dt*18);
 const pc=Math.cos(F.pitch),ps=Math.sin(F.pitch),C0=SP.c[0],C1=SP.c[1];
 const tx=fx-sc*C0,ty2=fy-sc*C1;
 gl.uniformMatrix3fv(ML,false,new Float32Array([sc*2/W,0,0, 0,-sc*2/H,0, tx*2/W-1,1-ty2*2/H,1]));
 const S={w:F.w,f:F.f,b:F.b,amp:opt.parts?F.amp:0,fold:F.fold,spd:F.spd||0,bend:opt.parts?F.bend:0,tsp:F.tsp||0,flare:F.flare||0};
 const turning=F.mode==="turn",P0=F.turnP,from=F.turnFrom,to=F.dir;
 const dirAt=X=>{if(!turning)return to;const u=Math.max(0,Math.min(1,(SP.head-X)/(SP.head-SP.tip))),p=Math.max(0,Math.min(1,P0*1.2-u*.2)),e=p*p*(3-2*p),d=from*Math.cos(e*Math.PI);return Math.abs(d)<.14?.14*Math.sign(d||to):d};
 const eR=SP.R.goz.w*SP.R.goz.s;
 for(const n of SP.O){const r=SP.R[n],B=r.B,P=r.P;if(!B)continue;
  if(r.k==="eye"||r.k==="pupil"){const e=opt.parts?field(SP.R.govde,r.at[0],r.at[1],S):[0,0],ex=r.k==="pupil"&&opt.parts?F.sac[0]*eR*.09:0,ey=r.k==="pupil"&&opt.parts?F.sac[1]*eR*.07:0,sx=dirAt(r.at[0]);
   for(let k=0;k<B.length;k+=2){const X=B[k]+e[0]+ex-C0,Y=B[k+1]+e[1]+ey-C1;P[k]=C0+(X*pc-Y*ps)*sx;P[k+1]=C1+X*ps+Y*pc}}
  else for(let k=0;k<B.length;k+=2){let X=B[k],Y=B[k+1];const sx=dirAt(X);if(opt.parts){const v=field(r,X,Y,S,k>>1);X+=v[0];Y+=v[1]}X-=C0;Y-=C1;P[k]=C0+(X*pc-Y*ps)*sx;P[k+1]=C1+X*ps+Y*pc}
  gl.bindVertexArray(r.vao);gl.bindBuffer(gl.ARRAY_BUFFER,r.pb);gl.bufferSubData(gl.ARRAY_BUFFER,0,P);gl.bindTexture(gl.TEXTURE_2D,r.tex);
  gl.uniform1f(DL,r.dim||1);gl.uniform1f(LL,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,r.ib);gl.drawElements(gl.TRIANGLES,r.n,gl.UNSIGNED_SHORT,0);
  if(opt.debug&&r.k!=="eye"&&r.k!=="pupil"){gl.uniform1f(LL,1);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,r.lb);gl.drawElements(gl.LINES,r.nl,gl.UNSIGNED_SHORT,0)}}
 gl.bindVertexArray(null)}
let last=0,fpsA=16;
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-(last||now))/1000);fpsA+=((now-(last||now))-fpsA)*.05;last=now;if(opt.slow)dt*=.25;
 gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);if(!FISH.length)return;
