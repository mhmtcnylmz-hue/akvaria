<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parçalı balık denemesi</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#071D32;overflow:hidden;font:700 13px/1.3 "Nunito",system-ui,sans-serif;color:#F2F8FB}
canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
#p{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-wrap:wrap;gap:6px;justify-content:center;z-index:2;pointer-events:none}
#p button{pointer-events:auto}
#p button{padding:9px 12px;border-radius:14px;border:1px solid rgba(138,220,232,.3);background:rgba(11,41,69,.82);color:#F2F8FB;font:inherit}
#p button.on{background:#2588EF;border-color:transparent}
#t{pointer-events:none;position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);text-align:center;text-shadow:0 1px 3px #000;opacity:.9;z-index:2;padding:0 12px}
</style></head><body>
<canvas id="bg"></canvas><canvas id="c"></canvas>
<div id="t">Esnek parçalı deneme (4) · <span id="st"></span></div>
<div id="p">
 <button data-sp="koi">Koi</button>
 <button data-sp="kristal">Kristal</button>
 <button data-k="parts" class="on">Esneme açık</button>
 <button data-k="debug">Ağı göster</button>
 <button data-k="slow">Yavaş çekim</button>
 <button data-k="big">Büyük</button>
</div>
<script>
"use strict";
const bgc=document.getElementById("bg"),bx=bgc.getContext("2d"),cv=document.getElementById("c"),stEl=document.getElementById("st");
const gl=cv.getContext("webgl2",{premultipliedAlpha:true,antialias:true,alpha:true});
const BG=new Image();BG.src="../a/08970b7f57cee584.webp";
const opt={parts:true,debug:false,slow:false,big:false};
if(!gl){document.getElementById("t").textContent="Bu tarayıcı WebGL2 desteklemiyor";throw 0}
// Türler. Koordinatlar gövde resmine göre (baş sağda). p: parçanın gövdeye bağlandığı nokta (kendi resminde),
// at: o noktanın gövdedeki yeri, s: ölçek, r: duruş açısı (radyan, + saat yönü), g: ağ sıklığı, k: hareket türü,
// src: başka parçanın resmini kullan, dim: koyulaştır, far: gövdenin öbür yanındaki yüzgeç
const SPEC={
 koi:{dir:"koi",head:728,tip:-310,cy:205,c:[330,215],
  R:{
   sirt:{k:"top",p:[440,215],at:[402,30],s:.86,g:[24,12]},
   yan2:{k:"pect",src:"yan",p:[160,15],at:[486,326],s:.74,r:.62,g:[12,12],dim:.55,far:1},
   karin:{k:"anal",p:[400,45],at:[178,302],s:.7,r:.22,g:[22,12]},
   alt:{k:"pelv",p:[325,15],at:[352,352],s:.72,r:.38,g:[18,14]},
   kuyruk:{k:"tail",p:[350,208],at:[30,180],s:1,g:[20,22],taper:[230,362,.74,208]},
   govde:{k:"body",p:[0,0],at:[0,0],s:1,g:[34,18]},
   yan:{k:"pect",p:[160,15],at:[470,330],s:.8,r:.55,g:[12,12]},
   goz:{k:"eye",p:[64,64],at:[565,248],s:1,g:[2,2]},
   gozbebek:{k:"pupil",p:[34,34],at:[565,248],s:1.15,g:[2,2]}},
  O:["sirt","yan2","karin","alt","kuyruk","govde","yan","goz","gozbebek"]},
 kristal:{dir:"kristal",head:575,tip:-230,cy:178,c:[300,178],
  R:{sirt:{k:"top",p:[640,248],at:[402,40],s:.72,g:[26,12]},karin:{k:"anal",p:[470,6],at:[390,312],s:.72,g:[22,10]},alt:{k:"pelv",p:[108,6],at:[440,284],s:.7,g:[6,16]},
   kuyruk:{k:"tail",p:[315,185],at:[30,177],s:.8,g:[16,20]},govde:{k:"body",p:[0,0],at:[0,0],s:1,g:[30,16]},yan:{k:"pect",p:[172,70],at:[374,214],s:.66,g:[14,8]},
   goz:{k:"eye",p:[68,68],at:[482,138],s:.46,g:[2,2]},gozbebek:{k:"pupil",p:[34,34],at:[482,138],s:.42,g:[2,2]}},
  O:["sirt","karin","alt","kuyruk","govde","yan","goz","gozbebek"]}
};
let SP=SPEC[/[?&]tur=kristal/.test(location.search)?"kristal":"koi"];
// ---------- WebGL
const vs=`#version 300 es
in vec2 a;in vec2 u;uniform mat3 M;out vec2 v;void main(){vec3 p=M*vec3(a,1.);gl_Position=vec4(p.xy,0.,1.);v=u;}`;
const fs=`#version 300 es
precision mediump float;in vec2 v;uniform sampler2D T;uniform float L;uniform float D;out vec4 o;void main(){vec4 c=texture(T,v);c.rgb*=D;o=L>.5?vec4(1.,1.,.2,1.)*.8:c;}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);gl.useProgram(pr);
const aL=gl.getAttribLocation(pr,"a"),uL=gl.getAttribLocation(pr,"u"),ML=gl.getUniformLocation(pr,"M"),LL=gl.getUniformLocation(pr,"L"),DL=gl.getUniformLocation(pr,"D");
gl.enable(gl.BLEND);gl.blendFunc(gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
const TEX={};
function tex(X,name,cb){const key=X.dir+"/"+name;
 if(!TEX[key])TEX[key]=new Promise(res=>{const im=new Image();im.onload=()=>{const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL,true);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,im);gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  res({t,w:im.width,h:im.height})};im.src=key+".webp"});
 TEX[key].then(cb)}
function loadSpec(X,done){let left=X.O.length;
 for(const n of X.O){const r=X.R[n];tex(X,r.src||n,T=>{r.tex=T.t;r.w=T.w;r.h=T.h;
  const [gx,gy]=r.g,n1=(gx+1)*(gy+1),B=new Float32Array(n1*2),U=new Float32Array(n1*2),c=Math.cos(r.r||0),s=Math.sin(r.r||0);let k=0;
  for(let j=0;j<=gy;j++)for(let i=0;i<=gx;i++){const px=i/gx*r.w;let py=j/gy*r.h;if(r.taper){const [x0,x1,f,cy]=r.taper,q=Math.max(0,Math.min(1,(px-x0)/(x1-x0))),e=q*q*(3-2*q);py=cy+(py-cy)*(1+(f-1)*e)}const lx=(px-r.p[0])*r.s,ly=(py-r.p[1])*r.s;B[k]=r.at[0]+lx*c-ly*s;B[k+1]=r.at[1]+lx*s+ly*c;U[k]=i/gx;U[k+1]=j/gy;k+=2}
  const I=[],Li=[];for(let j=0;j<gy;j++)for(let i=0;i<gx;i++){const a=j*(gx+1)+i,b=a+1,cc=a+gx+1,d=cc+1;I.push(a,b,cc,b,d,cc);Li.push(a,b,a,cc)}
  r.B=B;r.P=new Float32Array(n1*2);r.n=I.length;r.nl=Li.length;r.len=Math.max(r.w,r.h)*r.s;
  r.vao=gl.createVertexArray();gl.bindVertexArray(r.vao);
  r.pb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,r.pb);gl.bufferData(gl.ARRAY_BUFFER,r.P,gl.DYNAMIC_DRAW);gl.enableVertexAttribArray(aL);gl.vertexAttribPointer(aL,2,gl.FLOAT,false,0,0);
  const ub=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,ub);gl.bufferData(gl.ARRAY_BUFFER,U,gl.STATIC_DRAW);gl.enableVertexAttribArray(uL);gl.vertexAttribPointer(uL,2,gl.FLOAT,false,0,0);
  r.ib=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,r.ib);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(I),gl.STATIC_DRAW);
  r.lb=gl.createBuffer();gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,r.lb);gl.bufferData(gl.ELEMENT_ARRAY_BUFFER,new Uint16Array(Li),gl.STATIC_DRAW);gl.bindVertexArray(null);
  if(--left===0)done()})}}
// ---------- Hareket alanı: bütün parçalar aynı alandan geçer; birlikte esner, birbirinden kopmaz.
// Koi (sazan) gözlemine göre: dalga gövdenin arka yarısında büyür, hızlanınca vuruş genişliği değil sıklığı artar,
// birkaç vuruştan sonra süzülür; yan yüzgeçler yavaşken açılıp kürek çeker, hızlı süzülürken gövdeye yatar; dönüşte baş önce döner.
const sm=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
function field(r,X,Y,S){const HEAD=SP.head,TIP=SP.tip,LEN=HEAD-TIP,u=Math.max(0,Math.min(1,(HEAD-X)/LEN)),k=r.k,A=S.amp,ph=S.w-5.2*u;
 const env=Math.pow(u,2.3);let dy=A*LEN*.028*Math.sin(ph)*env+S.bend*LEN*.06*u*u,dx=0;
 const t0=SP.R.kuyruk.at[0]+10,tq=sm(t0,TIP,X);dx+=(t0-X)*.28*Math.min(1,A*1.4)*Math.pow(Math.sin(ph),2)*tq;dy+=A*LEN*.022*Math.sin(ph-1.0)*tq*tq;
 if(k==="tail"){const q=sm(t0,TIP+30,X);dy+=(A*10+3)*Math.sin(S.w*.9-1.7-(SP.cy-Y)/80)*q*q}
 if(k==="top"||k==="anal"||k==="pelv"){const d=Math.min(1.2,Math.hypot(X-r.at[0],Y-r.at[1])/r.len),wv=S.w*.85-d*2.3-X/110;
   dx+=(-5-8*A)*Math.sin(wv)*d*d-S.spd*22*d*d;dy+=(k==="top"?-1:1)*(3+3*A)*Math.sin(wv+.8)*d*d;
   if(k==="top")dy+=(Y-r.at[1])*(-.22*S.fold)}
 if(k==="pect"){const d=Math.max(0,Math.min(1,Math.hypot(X-r.at[0],Y-r.at[1])/r.len)),f=S.f+(r.far?Math.PI*.85:0)-d*1.4;
   const open=1-S.fold,o=.5+.5*Math.sin(f),fx=r.at[0]-X,fy=Y-r.at[1];
   dx+=fx*(.18+.45*S.fold)+fx*.35*open*o;dy+=(-fy*(.45*S.fold+.2*open*o)+7*open*Math.sin(f+.6))*d}
 if(k==="body"){const gx=SP.R.goz.at[0]-60,g=Math.exp(-((X-gx)**2)/2500)*Math.exp(-((Y-SP.cy)**2)/12000);dy+=(Y-SP.cy)*.03*Math.sin(S.b)*g}
 return [dx,dy]}
// ---------- davranış
let W=0,H=0,DPR=1;function size(){DPR=Math.min(2.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;for(const c of [cv,bgc]){c.width=W*DPR;c.height=H*DPR}drawBG()}addEventListener("resize",size);
function drawBG(){bx.setTransform(DPR,0,0,DPR,0,0);if(BG.naturalWidth){const k=Math.max(W/BG.naturalWidth,H/BG.naturalHeight),bw=BG.naturalWidth*k,bh=BG.naturalHeight*k;bx.drawImage(BG,(W-bw)/2,(H-bh)/2,bw,bh)}else{bx.fillStyle="#0b3b5c";bx.fillRect(0,0,W,H)}}
BG.onload=drawBG;size();
const F={x:.5,y:.45,v:0,vy:0,pitch:0,dir:1,tx:.7,ty:.4,mode:"glide",modeT:0,beats:0,w:0,f:0,b:0,amp:.15,fold:.5,bend:0,turnP:1,turnFrom:1,look:[0,0],lookT:0,sac:[0,0],lookAt:null,lookUntil:0,urg:0};
// yeni hedef: en az ekranın üçte biri kadar uzakta; çoğunlukla balığın baktığı yönde (sürekli geri dönmesin)
function pick(){const ahead=Math.random()<.75,d=F.dir*(ahead?1:-1);let tx=F.x+d*(.3+Math.random()*.35);if(tx<.18||tx>.82)tx=F.x-d*(.3+Math.random()*.3);F.tx=Math.max(.18,Math.min(.82,tx));F.ty=.22+Math.random()*.42;F.pickT=performance.now()}
F.turnCool=0;pick();window.__F=F;
cv.addEventListener("pointerdown",e=>{F.turnCool=0;F.tap=1;F.pickT=performance.now();F.tx=e.clientX/W;F.ty=Math.min(.75,Math.max(.15,e.clientY/H));F.urg=1;F.lookAt=[e.clientX,e.clientY];F.lookUntil=performance.now()+1600;if(F.mode!=="turn"){F.mode="burst";F.beats=Math.max(2,Math.min(5,1+Math.hypot((F.tx-F.x)*W,(F.ty-F.y)*H)/120|0))}});
document.getElementById("p").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.sp){const X=SPEC[b.dataset.sp];const go=()=>{SP=X;spBtn()};X.R.govde.vao?go():loadSpec(X,go);return}const k=b.dataset.k;opt[k]=!opt[k];b.classList.toggle("on",opt[k])});
const MODEN={glide:"süzülüyor",burst:"kuyruk vuruşu",hover:"durup kürek çekiyor",turn:"dönüyor"};
let last=0;
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-(last||now))/1000);last=now;if(opt.slow)dt*=.25;
 const L=Math.max(W,H),tdx=(F.tx-F.x)*W,tdy=(F.ty-F.y)*H,dist=Math.hypot(tdx,tdy),want=Math.sign(tdx)||F.dir;
 const behind=Math.sign(tdx)!==F.dir,fresh=now-(F.pickT||0)<1500;
 // vardı say: hedefe yakınsa ya da hedefin az ötesine geçtiyse dönmeden durup kürek çeker
 if((F.mode==="burst"||F.mode==="glide")&&(dist<(F.tap?45:90)||(!F.tap&&!fresh&&behind&&Math.abs(tdx)<170))){F.mode="hover";F.modeT=1.4+Math.random()*1.8;F.urg=0}
 // dönüş: hedef gerçekten arkadaysa ve son dönüşün üstünden zaman geçtiyse
 else if(F.mode!=="turn"&&F.mode!=="hover"&&behind&&Math.abs(tdx)>=(fresh?70:170)&&(fresh||now>F.turnCool)){F.mode="turn";F.turnP=0;F.turnFrom=F.dir;F.dir=-F.dir}
 F.modeT-=dt;
 if(F.mode==="turn"){F.turnP=Math.min(1,F.turnP+dt/.75);F.w+=dt*4;F.bend=Math.sin(F.turnP*Math.PI)*.9;F.v*=1-dt*1.2;if(F.turnP>=1){F.mode="burst";F.beats=2;F.bend=0;F.turnCool=now+1800}}
 else if(F.mode==="burst"){const pw=F.w;F.w+=dt*(6.2+1.8*F.urg);if(Math.floor(pw/6.283)!==Math.floor(F.w/6.283)){const near=Math.min(1,dist/260);F.v=Math.min((1.05+.55*F.urg)*(.5+.5*near),F.v+(.42+.22*F.urg)*(.45+.55*near));F.beats--}
  if(F.beats<=0){F.mode="glide";F.modeT=.9+Math.random()*1.4;F.urg=Math.max(0,F.urg-.5)}}
 else if(F.mode==="glide"){F.w+=dt*1.6;if(F.modeT<=0||F.v<.25){F.mode="burst";F.beats=Math.max(1,Math.min(4,1+dist/170|0));F.modeT=1.5+Math.random()*2.5}}
 else if(F.mode==="hover"){F.w+=dt*1.4;if(F.modeT<=0){F.tap=0;pick();F.mode="glide";F.modeT=.3}}
 F.v*=1-dt*(F.mode==="hover"?1.8:.55);
 // burun hedefe döner: hedef aşağıdaysa burun aşağı (en çok ~45°); dururken yavaşça düzleşir
 const pT=F.mode==="hover"||F.mode==="turn"?Math.max(-.25,Math.min(.25,Math.atan2(tdy,Math.max(60,Math.abs(tdx)))))*(dist>30?1:0):Math.max(-.8,Math.min(.8,Math.atan2(tdy,Math.max(20,Math.abs(tdx)))));
 F.pitch+=(pT-F.pitch)*Math.min(1,dt*(F.mode==="burst"?3:1.6));
 // durup kürek çekerken yüzgeçlerle hedefe doğru çok yavaş süzülür
 if(F.mode==="hover"&&dist>20)F.v=Math.max(F.v,Math.min(.18,dist/600));
 const BLpx=(SP.head-SP.tip)*(Math.min(W,H)/(SP.head-SP.tip)*.8)*(opt.big?.78:.55);F.x+=F.v*BLpx*Math.cos(F.pitch)*F.dir*dt/W;F.y+=F.v*BLpx*Math.sin(F.pitch)*dt/H;
 {const mg=Math.min(.45,(SP.head-SP.tip)*.5*(Math.min(W,H)/(SP.head-SP.tip)*.8)*(opt.big?.78:.55)/W+.02);if((F.dir<0&&F.x<mg+.08)||(F.dir>0&&F.x>1-mg-.08)){if(!F.tap&&F.mode!=="turn"&&F.mode!=="hover"){F.v*=1-dt*2;if(Math.sign(F.tx-F.x)===F.dir)pick()}}F.x=Math.max(mg,Math.min(1-mg,F.x));F.mg=mg;if(F.tap)F.tx=Math.max(mg,Math.min(1-mg,F.tx))}{const yb=Math.max(.12,Math.min(.8,F.y));if(yb!==F.y){F.y=yb;F.pitch*=.9}}
 const spd=Math.min(1,F.v/1.2);
 const ampT=F.mode==="burst"?.5+.08*F.urg:F.mode==="turn"?.35:F.mode==="hover"?.12:.08;F.amp+=(ampT-F.amp)*Math.min(1,dt*3.5);
 const foldT=F.mode==="hover"||F.mode==="turn"?0:spd>.45?.85:.35;F.fold+=(foldT-F.fold)*Math.min(1,dt*2.5);
 F.f+=dt*(F.mode==="hover"?4.2:2.6);F.b+=dt*(F.mode==="hover"?3:2.2);
 if(now>F.lookT){F.lookT=now+500+Math.random()*1600;F.look=[Math.random()*2-1,Math.random()*1.4-.7]}
 const sc=(Math.min(W,H)/(SP.head-SP.tip)*.8)*(opt.big?.78:.55),fx=F.x*W,fy=F.y*H+Math.sin(now/1100)*3;
 let lk=F.look;if(F.lookUntil>now&&F.lookAt){const lx=(F.lookAt[0]-fx)*F.dir,ly=F.lookAt[1]-fy,mm=Math.hypot(lx,ly)||1;lk=[lx/mm,ly/mm]}
 F.sac[0]+=(lk[0]-F.sac[0])*Math.min(1,dt*18);F.sac[1]+=(lk[1]-F.sac[1])*Math.min(1,dt*18);
 stEl.textContent=MODEN[F.mode]+" · tanka dokun";
 const c=1,s=0,pc=Math.cos(F.pitch),ps=Math.sin(F.pitch),C0=SP.c[0],C1=SP.c[1];
 const ox=-SP.c[0],oy=-SP.c[1],ax=c*sc,bxx=-s*sc,ay=s*sc,by=c*sc,tx=fx+ax*ox+bxx*oy,ty2=fy+ay*ox+by*oy;
 const M=new Float32Array([ax*2/W,-ay*2/H,0, bxx*2/W,-by*2/H,0, tx*2/W-1,1-ty2*2/H,1]);
 gl.viewport(0,0,cv.width,cv.height);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.uniformMatrix3fv(ML,false,M);
 const S={w:F.w,f:F.f,b:F.b,amp:opt.parts?F.amp:0,fold:F.fold,spd,bend:opt.parts?F.bend:0};
 // yön: dönüşte baş önce döner, kuyruk arkadan gelir (her noktanın kendi yönü)
 const turning=F.mode==="turn",P0=F.turnP,from=F.turnFrom,to=F.dir;
 const dirAt=X=>{if(!turning)return to;const u=Math.max(0,Math.min(1,(SP.head-X)/(SP.head-SP.tip))),p=Math.max(0,Math.min(1,P0*1.2-u*.2)),e=p*p*(3-2*p),d=from*Math.cos(e*Math.PI);return Math.abs(d)<.14?.14*Math.sign(d||to):d};
 for(const n of SP.O){const r=SP.R[n],B=r.B,P=r.P;if(!B)continue;
  if(r.k==="eye"||r.k==="pupil"){const e=opt.parts?field(SP.R.govde,r.at[0],r.at[1],S):[0,0],ex=r.k==="pupil"&&opt.parts?F.sac[0]*12:0,ey=r.k==="pupil"&&opt.parts?F.sac[1]*9:0,sx=dirAt(r.at[0]);
   for(let k=0;k<B.length;k+=2){const X=B[k]+e[0]+ex-C0,Y=B[k+1]+e[1]+ey-C1;P[k]=C0+(X*pc-Y*ps)*sx;P[k+1]=C1+X*ps+Y*pc}}
  else for(let k=0;k<B.length;k+=2){let X=B[k],Y=B[k+1];const sx=dirAt(X);if(opt.parts){const v=field(r,X,Y,S);X+=v[0];Y+=v[1]}X-=C0;Y-=C1;P[k]=C0+(X*pc-Y*ps)*sx;P[k+1]=C1+X*ps+Y*pc}
  gl.bindVertexArray(r.vao);gl.bindBuffer(gl.ARRAY_BUFFER,r.pb);gl.bufferSubData(gl.ARRAY_BUFFER,0,P);gl.bindTexture(gl.TEXTURE_2D,r.tex);
  gl.uniform1f(DL,r.dim||1);gl.uniform1f(LL,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,r.ib);gl.drawElements(gl.TRIANGLES,r.n,gl.UNSIGNED_SHORT,0);
  if(opt.debug&&r.k!=="eye"&&r.k!=="pupil"){gl.uniform1f(LL,1);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,r.lb);gl.drawElements(gl.LINES,r.nl,gl.UNSIGNED_SHORT,0)}}
 gl.bindVertexArray(null);
}
function spBtn(){document.querySelectorAll("[data-sp]").forEach(b=>b.classList.toggle("on",SPEC[b.dataset.sp]===SP))}
spBtn();loadSpec(SP,()=>requestAnimationFrame(loop));
</script>
</body></html>
