<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Parçalı balık denemesi</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#071D32;overflow:hidden;font:700 13px/1.3 "Nunito",system-ui,sans-serif;color:#F2F8FB}
canvas{display:block;width:100%;height:100%;touch-action:none}
#p{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#p button{flex:0 1 auto;padding:9px 12px;border-radius:14px;border:1px solid rgba(138,220,232,.3);background:rgba(11,41,69,.82);color:#F2F8FB;font:inherit}
#p button.on{background:#2588EF;border-color:transparent}
#t{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10px);text-align:center;text-shadow:0 1px 3px #000;opacity:.9}
</style></head><body>
<canvas id="c"></canvas>
<div id="t">Kristal Melek · parçalı deneme · tanka dokun, balık oraya bakıp yüzer</div>
<div id="p">
 <button data-k="parts" class="on">Parçalar oynasın</button>
 <button data-k="debug">Parçaları göster</button>
 <button data-k="slow">Yavaş çekim</button>
 <button data-k="big">Büyük</button>
</div>
<script>
"use strict";
const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const BG=new Image();BG.src="../a/08970b7f57cee584.webp";
const N=["govde","kuyruk","sirt","karin","yan","alt","goz","gozbebek"],I={};let left=N.length;
N.forEach(n=>{const im=new Image();im.onload=()=>{if(--left===0)requestAnimationFrame(loop)};im.src="kristal/"+n+".webp";I[n]=im});
// Parçaların gövdeye göre yeri (gövde resmi 594x355 piksel). p: parçanın kendi içindeki dönme noktası, at: gövdedeki yeri, s: ölçek
const R={
 kuyruk:{p:[315,185],at:[22,177],s:.8},
 sirt:{p:[640,248],at:[405,34],s:.72},
 karin:{p:[470,6],at:[392,318],s:.72},
 alt:{p:[108,6],at:[440,286],s:.7},
 yan:{p:[172,70],at:[372,214],s:.66},
 goz:{p:[68,68],at:[482,138],s:.46},
 gozbebek:{at:[482,138],s:.42}
};
const opt={parts:true,debug:false,slow:false,big:false};
document.getElementById("p").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const k=b.dataset.k;opt[k]=!opt[k];b.classList.toggle("on",opt[k])});
let W=0,H=0,DPR=1;function size(){DPR=Math.min(2.5,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR}addEventListener("resize",size);size();
// balığın durumu
const F={x:.5,y:.45,vx:0,vy:0,dir:1,turn:1,tx:.7,ty:.4,t:0,dash:0,look:[0,0],lookT:0,sacc:0,react:0};
function pick(){F.tx=.15+Math.random()*.7;F.ty=.2+Math.random()*.45}
pick();
cv.addEventListener("pointerdown",e=>{F.tx=e.clientX/W;F.ty=Math.min(.75,Math.max(.15,e.clientY/H));F.dash=1;F.react=1;F.lookAt=[e.clientX,e.clientY];F.lookUntil=performance.now()+1500});
function part(n,ang,sx,sy){const r=R[n],im=I[n];ctx.save();ctx.translate(r.at[0],r.at[1]);ctx.rotate(ang||0);ctx.scale((sx||1)*r.s,(sy||1)*r.s);ctx.drawImage(im,-r.p[0],-r.p[1]);
 if(opt.debug){ctx.strokeStyle="#ff0";ctx.lineWidth=3/r.s;ctx.strokeRect(0-r.p[0],0-r.p[1],im.width,im.height);ctx.fillStyle="#f00";ctx.beginPath();ctx.arc(0,0,8/r.s,0,7);ctx.fill()}ctx.restore()}
let last=0;
function loop(now){requestAnimationFrame(loop);let dt=Math.min(.05,(now-(last||now))/1000);last=now;if(opt.slow)dt*=.25;
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(BG.complete&&BG.naturalWidth){const k=Math.max(W/BG.naturalWidth,H/BG.naturalHeight),bw=BG.naturalWidth*k,bh=BG.naturalHeight*k;ctx.drawImage(BG,(W-bw)/2,(H-bh)/2,bw,bh)}else{ctx.fillStyle="#0b3b5c";ctx.fillRect(0,0,W,H)}
 // yüzme
 const dx=F.tx-F.x,dy=F.ty-F.y,d=Math.hypot(dx*W,dy*H);if(d<30){F.dash=0;if(Math.random()<dt*.6)pick()}
 const sp=(F.dash?.55:.16)*(opt.big?1:1.1),ax=dx/Math.max(.001,Math.hypot(dx,dy)),ay=dy/Math.max(.001,Math.hypot(dx,dy));
 F.vx+=(ax*sp*(d>30?1:0)-F.vx)*Math.min(1,dt*2.2);F.vy+=(ay*sp*.6*(d>30?1:0)-F.vy)*Math.min(1,dt*2.2);
 F.x+=F.vx*dt*W/Math.max(W,H)*1.2;F.y+=F.vy*dt*H/Math.max(W,H)*1.2;
 if(Math.abs(F.vx)>.02)F.dir=F.vx>0?1:-1;F.turn+=(F.dir-F.turn)*Math.min(1,dt*5);
 const speed=Math.min(1,Math.hypot(F.vx,F.vy)/.4);F.t+=dt*(1.6+4.5*speed);F.react=Math.max(0,F.react-dt*1.5);
 // göz: küçük sıçramalarla bakar; dokununca oraya bakar
 if(now>F.lookT){F.lookT=now+500+Math.random()*1600;F.look=[Math.random()*2-1,Math.random()*1.4-.7]}
 const sc=(Math.min(W,H)/594)*(opt.big?.78:.55),fx=F.x*W,fy=F.y*H;
 let lk=F.look;if(F.lookUntil>now&&F.lookAt){const lx=(F.lookAt[0]-fx)*F.dir,ly=F.lookAt[1]-fy,m=Math.hypot(lx,ly)||1;lk=[lx/m,ly/m]}
 F.sacc=F.sacc||[0,0];F.sacc[0]+=(lk[0]-F.sacc[0])*Math.min(1,dt*18);F.sacc[1]+=(lk[1]-F.sacc[1])*Math.min(1,dt*18);
 ctx.save();ctx.translate(fx,fy+Math.sin(now/900)*4);
 const bank=Math.max(-.25,Math.min(.25,F.vy*.9))*F.dir;ctx.rotate(bank);
 ctx.scale(sc*F.turn,sc*(1-.08*(1-Math.abs(F.turn))));ctx.translate(-300,-178);
 const t=F.t,P=opt.parts,amp=.16+.2*speed+.25*F.react;
 // arkadakiler: sırt, karın, alt yüzgeç, kuyruk
 part("sirt",P?Math.sin(t-.9)*.05:0,1,P?1+Math.sin(t-.9)*.03:1);
 part("karin",P?-Math.sin(t-.9)*.05:0,1,P?1+Math.sin(t-.7)*.03:1);
 part("alt",P?Math.sin(t*.7)*.12+.05:0);
 part("kuyruk",P?Math.sin(t)*amp:0,P?1-.18*Math.abs(Math.sin(t)):1,1);
 // gövde: kuyruk tarafı hafifçe kıvrılır
 if(P){const im=I.govde,n=12,cw=im.width/n;for(let i=0;i<n;i++){const u=1-(i+.5)/n,off=Math.sin(t-u*1.2)*amp*28*u*u;const x0=Math.floor(i*cw),x1=Math.ceil((i+1)*cw);ctx.save();ctx.beginPath();ctx.rect(x0,-40,x1-x0,im.height+80);ctx.clip();ctx.drawImage(im,0,off);ctx.restore()}}
 else ctx.drawImage(I.govde,0,0);
 // öndekiler: yan yüzgeç, göz
 part("yan",P?Math.sin(t*1.3+1)*(.28+.2*speed)+.1:0,P?.75+.25*Math.abs(Math.cos(t*1.3+1)):1,1);
 part("goz");
 {const r=R.gozbebek,g=R.goz;ctx.save();ctx.translate(g.at[0]+(P?F.sacc[0]*13:0),g.at[1]+(P?F.sacc[1]*10:0));ctx.scale(r.s,r.s);ctx.drawImage(I.gozbebek,-I.gozbebek.width/2,-I.gozbebek.height/2);ctx.restore()}
 ctx.restore();
}
</script>
</body></html>
